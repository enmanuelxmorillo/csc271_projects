<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whats Your Dish</title>
  </head>

  <body>
    <h1><a href="index.html">Take me back to Enmanuel & Davids Dish ! </a></h1>

    <form>
      <label for="dish">What is your favorite dish?</label><br />
      <input type="text" id="dish" name="dish" /><br /><br />
      <label for="ingredients"
        >What are the ingredients for your favorite dish?</label
      ><br />
      <input type="text" id="ingredients" name="ingredients" /><br /><br />
      <label for="instructions"
        >What are the instructions for your favorite dish?</label
      ><br />
      <input type="text" id="instructions" name="instructions" /><br /><br />

      <h2>How difficult is your favorite dish?</h2>
      <input type="radio" id="Hard" name="difficulty" value="Hard" />
      <label for="Hard">Hard</label><br />
      <input type="radio" id="Medium" name="difficulty" value="Medium" />
      <label for="Medium">Medium</label><br />
      <input type="radio" id="Easy" name="difficulty" value="Easy" />
      <label for="Easy">Easy</label><br /><br />

      <h2>What is your dietary preference?</h2>
      <input type="checkbox" id="Vegetarian" name="diet" value="Vegetarian" />
      <label for="Vegetarian"> Vegetarian</label><br />
      <input type="checkbox" id="Vegan" name="diet" value="Vegan" />
      <label for="Vegan"> Vegan</label><br />
      <input type="checkbox" id="Pescatarian" name="diet" value="Pescatarian" />
      <label for="Pescatarian"> Pescatarian</label><br /><br />

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
